<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STING YELLOW</title>

  <style>
    body {
      margin: 0;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 25px;
      background: #222;
      border-bottom: 3px solid #ffd400;
    }

    h1 {
      color: #ffd400;
      font-size: 45px;
    }

    .product {
      margin: 50px auto;
      padding: 30px;
    }

    .can {
      width: 140px;
      height: 280px;
      margin: 30px auto;
      border-radius: 20px;
      background: linear-gradient(
        90deg, #b88600, #fff000, #d6a900
      );
      color: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 40px #ffd40066;
      transform: rotate(-7deg);
    }

    .can strong {
      font-size: 30px;
    }

    .button {
      display: inline-block;
      background: #ffd400;
      color: #111;
      padding: 14px 25px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      padding: 25px;
      color: #aaa;
      background: #222;
    }
  </style>
</head>

<body>

<header>
  <h1>STING YELLOW</h1>
  <p>ພະລັງງານແຫ່ງສີເຫຼືອງ</p>
</header>

<section class="product">
  <div class="can">
    <strong>STING</strong>
    <p>ENERGY DRINK</p>
    <h2>★</h2>
  </div>

  <h2>ຍິນດີຕ້ອນຮັບ</h2>
  <p>ຂໍຕ້ອນຮັບທຸກຄົນສູ່ STING YELLOW</p>

  <a href="#about" class="button">ເບິ່ງເພີ່ມເຕີມ</a>
</section>

<section id="about">
  <h2>ກ່ຽວກັບສິນຄ້າ</h2>
  <p>STING YELLOW COLLECTION</p>
</section>

<footer>
  © 2026 STING YELLOW
  <p>ສ້າງເພື່ອການສຶກສາ</p>
</footer>

</body>
</html>
